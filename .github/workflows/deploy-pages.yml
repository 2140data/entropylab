name: Deploy EntropyLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir _site
          cp entropylab.html _site/index.html
          cp versions/entropylab-*.html _site/
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          entries = []
          for path in Path("versions").glob("entropylab-*.html"):
              match = re.fullmatch(r"entropylab-(\d+(?:\.\d+)*)\.html", path.name)
              if match:
                  version = match.group(1)
                  entries.append({
                      "version": f"v{version}",
                      "file": path.name,
                      "sort": [int(part) for part in version.split(".")],
                  })

          entries.sort(key=lambda item: item.pop("sort"), reverse=True)
          Path("_site/versions.json").write_text(
              json.dumps({"versions": entries}, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
