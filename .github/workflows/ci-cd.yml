name: EntropyLab CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox
          firefox --version

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Verify committed build output is reproducible
        run: |
          if [ -n "$(git status --porcelain -- index.html versions.json 'entropylab-*.html')" ]; then
            echo "Build output differs from the committed files."
            echo "Run 'npm run build' and commit the result."
            git status --porcelain -- index.html versions.json 'entropylab-*.html'
            exit 1
          fi

      - name: Verify site artifact
        run: npm run verify

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html entropylab-*.html versions.json _site/
          cp -r assets _site/assets
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
