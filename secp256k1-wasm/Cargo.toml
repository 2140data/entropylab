[package]
name = "secp256k1-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "Unlicense"
description = "WebAssembly bindings to libsecp256k1 for EntropyLab (built by CI, committed as src/js/secp256k1-wasm-b64.js)"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact version, lockfile-committed, per CONTRIBUTING.md §2. This crate is the
# FFI for bitcoin-core/secp256k1; the vendored C sources build with clang.
# "lowmemory" shrinks the precomputed EC tables baked into the WASM data
# segment (~1.1 MB -> negligible); signing speed is irrelevant for a
# calculator.
secp256k1-sys = { version = "=0.14.0", features = ["lowmemory"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
